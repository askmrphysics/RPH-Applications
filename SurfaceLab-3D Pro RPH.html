  border-radius: 999px;

  border-radius: 50%;
  width: 15px;
  height: 15px;
  transition: transform .12s cubic-bezier(.16, 1, .3, 1);
  box-shadow: 0 0 0 1px #ffffff29;
}

  transform: scale(1.16);
}

  border: 2px solid #0e131c;
  border-radius: 50%;
  width: 15px;
  height: 15px;
  transition: transform .12s cubic-bezier(.16, 1, .3, 1);

}
