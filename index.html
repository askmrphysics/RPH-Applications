<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Mr Physics — Interactive Math and Physics Simulators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-canvas: #e5e9f0;
      --bg-surface: #ffffff;
      --bg-well: #eef2f6;
      --border-hairline: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #0284c7;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
    }

    .topbar-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .hero {
      margin-bottom: 36px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 auto 12px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(1.6rem, 2.9vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
      color: var(--text-primary);
    }

    .hero p {
      margin: 0 auto;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    @media (min-width: 1024px) {
      .hero h1,
      .hero p {
        white-space: nowrap;
      }
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border-hairline);
      padding: 4px;
      border-radius: 10px;
    }

    .filter-btn {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .filter-btn:hover {
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--text-primary);
      color: #ffffff;
    }

    .search-input {
      min-width: 240px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
    }

    .search-input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    .tile {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      text-decoration: none;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.14);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.16);
      outline: 2px solid #0f172a;
      outline-offset: 2px;
    }

    .tile-motif {
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
    }

    .tile-motif svg {
      width: 100%;
      height: 100%;
    }

    .tile-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tile-meta {
      font-size: 0.6875rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      margin-bottom: 4px;
    }

    .tile-title {
      margin: 0 0 6px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .tile-summary {
      margin: 0 0 14px;
      font-size: 0.75rem;
      line-height: 1.45;
      flex: 1;
    }

    .tile-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      font-size: 0.6875rem;
    }

    .tile-file {
      font-family: "IBM Plex Mono", monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-launch {
      font-weight: 700;
      white-space: nowrap;
    }

    .footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-hairline);
    }

    .footer-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 20px 24px;
      font-size: 0.8125rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
</head>

    function getMotifSvg(motif, inkMode) {
      const p = inkMode === "on-dark" ? "#FFFFFF" : "#0F172A";
      const s = inkMode === "on-dark" ? "rgba(255,255,255,0.55)" : "rgba(15,23,42,0.45)";
      const g = inkMode === "on-dark" ? "rgba(255,255,255,0.25)" : "rgba(15,23,42,0.2)";
      const f = inkMode === "on-dark" ? "rgba(255,255,255,0.16)" : "rgba(15,23,42,0.12)";
      const c = inkMode === "on-dark" ? "rgba(255,255,255,0.28)" : "rgba(15,23,42,0.22)";

      if (motif === "surface") {
        const steps = [-1, -2/3, -1/3, 0, 1/3, 2/3, 1];
        const proj = (u, v) => {
          const z = u*u - v*v;
          return [(120 + 54*u - 42*v).toFixed(1), (54 + 14*u + 16*v - 23*z).toFixed(1)];
        };
        const uLines = steps.map(v => '<path d="' + steps.map((u, i) => (i===0?'M':'L') + ' ' + proj(u, v).join(' ')).join(' ') + '" />').join('');
        const vLines = steps.map(u => '<path d="' + steps.map((v, i) => (i===0?'M':'L') + ' ' + proj(u, v).join(' ')).join(' ') + '" />').join('');
        return '<svg viewBox="0 0 240 104"><g fill="none" stroke="' + s + '" stroke-width="1.25">' + vLines + '</g><g fill="none" stroke="' + p + '" stroke-width="1.5">' + uLines + '</g><circle cx="120" cy="54" r="3" fill="' + p + '"/></svg>';
      }

      if (motif === "integral") {
        const rows = ["..#.....#..","...#...#...","..#######..",".##.###.##.","###########","#.#######.#","#.#.....#.#","...##.##..."];
        let rects = "";
        rows.forEach((row, r) => {
          for (let col = 0; col < row.length; col++) {
            if (row[col] === "#") rects += '<rect x="' + (87 + col * 6) + '" y="' + (16 + r * 6) + '" width="6" height="6"/>';
          }
        });
        return '<svg viewBox="0 0 240 104"><g fill="' + p + '" shape-rendering="crispEdges">' + rects + '<rect x="118" y="70" width="4" height="10"/><rect x="52" y="84" width="18" height="6" fill="' + c + '"/><rect x="170" y="84" width="18" height="6" fill="' + c + '"/><rect x="111" y="86" width="18" height="6"/></g></svg>';
      }

      const map = {
        parametric: '<svg viewBox="0 0 240 104"><line x1="20" y1="52" x2="220" y2="52" stroke="' + g + '"/><line x1="120" y1="12" x2="120" y2="92" stroke="' + g + '"/><path d="M 120 52 C 168 14, 196 34, 174 64 C 154 90, 96 86, 66 56 C 42 32, 76 14, 120 52 Z" fill="none" stroke="' + p + '" stroke-width="2.25"/><circle cx="174" cy="48" r="4" fill="' + p + '"/></svg>',
        quadratic: '<svg viewBox="0 0 240 104"><line x1="24" y1="68" x2="216" y2="68" stroke="' + g + '"/><line x1="120" y1="12" x2="120" y2="92" stroke="' + g + '"/><path d="M 54 18 Q 120 124 186 18" fill="none" stroke="' + p + '" stroke-width="2.25"/><circle cx="120" cy="71" r="4" fill="' + p + '"/></svg>',
        studio: '<svg viewBox="0 0 240 104"><circle cx="120" cy="52" r="24" fill="' + f + '" stroke="' + p + '" stroke-width="2.25"/><polygon points="120,28 141,64 99,64" fill="none" stroke="' + p + '" stroke-width="1.75"/></svg>',
        vector: '<svg viewBox="0 0 240 104"><polygon points="68,66 132,84 180,52 116,34" fill="' + f + '" stroke="' + p + '" stroke-width="1.75"/><line x1="120" y1="58" x2="120" y2="16" stroke="' + p + '" stroke-width="2.25"/><line x1="120" y1="58" x2="170" y2="72" stroke="' + p + '" stroke-width="2"/></svg>',
        calculator: '<svg viewBox="0 0 240 104"><rect x="86" y="12" width="68" height="80" rx="6" fill="' + f + '" stroke="' + p + '" stroke-width="1.75"/><rect x="94" y="20" width="52" height="16" rx="2" fill="none" stroke="' + s + '"/><line x1="100" y1="28" x2="134" y2="28" stroke="' + p + '" stroke-width="2.25"/></svg>',
        trig: '<svg viewBox="0 0 240 104"><line x1="20" y1="52" x2="220" y2="52" stroke="' + g + '"/><path d="M 24 52 C 44 14, 68 14, 88 52 C 108 90, 132 90, 152 52 C 172 14, 196 14, 216 52" fill="none" stroke="' + p + '" stroke-width="2.5"/></svg>',
        selector: '<svg viewBox="0 0 240 104"><line x1="44" y1="30" x2="196" y2="30" stroke="' + g + '" stroke-width="2.5"/><line x1="44" y1="30" x2="136" y2="30" stroke="' + p + '" stroke-width="3"/><circle cx="136" cy="30" r="5.5" fill="' + p + '"/><line x1="44" y1="68" x2="196" y2="68" stroke="' + g + '" stroke-width="2.5"/><line x1="44" y1="68" x2="164" y2="68" stroke="' + p + '" stroke-width="3"/><circle cx="164" cy="68" r="5.5" fill="' + p + '"/></svg>',
        de: '<svg viewBox="0 0 240 104"><path d="M 32 76 C 72 64, 96 34, 126 36 C 156 38, 178 66, 208 78" fill="none" stroke="' + p + '" stroke-width="2.5"/></svg>',

    const gridEl = document.getElementById("simulatorGrid");
    const filtersEl = document.getElementById("categoryFilters");

    let activeCategory = "All";
    let searchQuery = "";
    const categories = ["All", ...new Set(SIMULATORS.map((s) => s.category))];

    function renderFilters() {
      filtersEl.innerHTML = "";
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-btn" + (activeCategory === cat ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          activeCategory = cat;
          renderFilters();
          renderGrid();
        });
        filtersEl.appendChild(btn);
      });
    }

    function renderGrid() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = SIMULATORS.filter((sim) => {
        const matchesCat = activeCategory === "All" || sim.category === activeCategory;
        const matchesQuery =
          !q ||
          sim.name.toLowerCase().includes(q) ||
          sim.summary.toLowerCase().includes(q) ||
          sim.file.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });

      gridEl.innerHTML = "";
      filtered.forEach((sim, index) => {
        const theme = TILE_COLORS[sim.color] || TILE_COLORS.blue;
        const isDark = theme.inkMode === "on-dark";
        const titleColor = isDark ? "#FFFFFF" : "#0F172A";
        const bodyColor = isDark ? "rgba(255,255,255,0.88)" : "rgba(15,23,42,0.84)";
        const mutedColor = isDark ? "rgba(255,255,255,0.75)" : "rgba(15,23,42,0.68)";
        const wellBg = isDark ? "rgba(0,0,0,0.16)" : "rgba(15,23,42,0.08)";
        const divider = isDark ? "rgba(255,255,255,0.2)" : "rgba(15,23,42,0.15)";

        const tile = document.createElement("a");
        tile.className = "tile";
        tile.href = sim.file;
        tile.style.backgroundColor = theme.bgHex;
        tile.style.color = titleColor;

        const num = String(index + 1).padStart(2, "0");
        const svg = getMotifSvg(sim.motif, theme.inkMode);

        tile.innerHTML = `
          <div class="tile-motif" style="background:${wellBg};border-bottom:1px solid ${divider};">${svg}</div>
          <div class="tile-body">
            <div class="tile-meta" style="color:${mutedColor};">${num} &middot; ${sim.category}</div>
            <h2 class="tile-title" style="color:${titleColor};">${sim.name}</h2>
            <p class="tile-summary" style="color:${bodyColor};">${sim.summary}</p>
            <div class="tile-footer" style="border-top:1px solid ${divider};">
              <span class="tile-file" style="color:${mutedColor};">${sim.file}</span>
              <span class="tile-launch" style="color:${titleColor};">Launch &rarr;</span>
            </div>
          </div>
        `;
        gridEl.appendChild(tile);
      });

      countEl.textContent = `Showing ${filtered.length} of ${SIMULATORS.length} simulators`;
    }

    searchEl.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderGrid();
    });

    renderFilters();
    renderGrid();
  </script>
</body>
</html>
